name: Build Action

on:
  workflow_call:
    inputs:
      project-name:
        description: "Project Name (e.g. zMenu)"
        required: true
        type: string
      java-version:
        description: "Optional java version"
        required: false
        type: string
        default: "25"
      java-distribution:
        description: "Optional java distribution"
        required: false
        type: string
        default: "temurin"
      publish:
        description: "If a package should be publish through ghcr.io"
        required: false
        type: boolean
        default: false
      project-to-publish:
        description: "Name of the project to publish (e.g. API:publish)"
        required: false
        type: string
        default: "publish"
      build-command:
        description: "Optional build command to run (default to ./gradlew build)"
        required: false
        type: string
        default: "./gradlew build"
      publish-on-discord:
        description: "If a message should be sent to discord on build completion"
        required: false
        type: boolean
        default: true
      discord-avatar-url:
        description: "Avatar url (default to zMenu avatar)"
        required: false
        type: string
        default: "https://minecraft-inventory-builder.com/storage/images/9UgcfGZyrmbVrXw5lbj5kXq6fW8F4nhwj6Cx4nVG.png"
      default-branch:
        description: "Default branch to check for releases"
        required: false
        type: string
        default: "main"
      runs-on:
        description: "Optional label for the runner to run on"
        required: false
        type: string
        default: "['ubuntu-latest']"
    secrets:
      WEBHOOK_URL:
        description: "Discord webhook url"
        required: true
      MAVEN_USERNAME:
        description: "Maven Username"
        required: true
      MAVEN_PASSWORD:
        description: "Maven password"
        required: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: write
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Set IS_DEFAULT_BRANCH env var
        run: |
          if [ "${GITHUB_REF##*/}" = "${{ inputs.default-branch }}" ]; then
            echo "IS_DEFAULT_BRANCH=true" >> "$GITHUB_ENV"
          else
            echo "IS_DEFAULT_BRANCH=false" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # ratchet:actions/setup-java@v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # ratchet:gradle/actions@v6.3.0

      - name: Make the short sha
        id: short_sha
        run: |
          echo "GITHUB_SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            ${{ inputs.build-command }}
          else
            ${{ inputs.build-command }} -Darchive.classifier=DEV -Dgithub.sha=${{ steps.short_sha.outputs.GITHUB_SHA_SHORT }}
          fi

      - name: Publish on maven
        if: ${{ inputs.publish && github.event_name != 'pull_request' }}
        run: |
          GRADLE_CMD="./gradlew ${{ inputs.project-to-publish }}"
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            $GRADLE_CMD -Drepository.name=releases
          else
            $GRADLE_CMD -Darchive.classifier=DEV -Dgithub.sha=${{ steps.short_sha.outputs.GITHUB_SHA_SHORT }}
          fi

        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Find ${{ inputs.project-name }} JAR
        id: find_jar
        run: |
          echo "Finding ${{ inputs.project-name }} JAR..."
          jar_path=$(find target/ -name '*.jar' | head -n 1)
          echo "Found ${{ inputs.project-name }} JAR at: $jar_path"
          echo "JAR_PATH=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Upload JAR as artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.project-name }}-DEV-${{ steps.short_sha.outputs.GITHUB_SHA_SHORT }}-PR-${{ github.event.number }}-${{ github.run_id }}
          path: target/

      - name: Discord Webhook Action
        if: ${{ inputs.publish-on-discord && github.event_name != 'pull_request' }}
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # ratchet:tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: ${{ env.IS_DEFAULT_BRANCH == 'true' && format('New release build of {0} is available!', inputs.project-name) || format('New development build of {0} is available!', inputs.project-name) }}
          avatar-url: ${{ inputs.discord-avatar-url }}
          username: ${{ inputs.project-name }}
          filename: ${{ steps.find_jar.outputs.jar_path }}
