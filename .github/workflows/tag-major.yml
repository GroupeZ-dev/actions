name: Move major version tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the major tag at (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  move-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Move the major tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$RELEASE_TAG' is not a vMAJOR.MINOR.PATCH tag; refusing to move a major tag."
            exit 1
          fi

          MAJOR="${RELEASE_TAG%%.*}"
          echo "Pointing $MAJOR at $RELEASE_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR" "$RELEASE_TAG"
          git push --force origin "refs/tags/$MAJOR"

          echo "### Major tag moved" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$MAJOR\` now points at \`$RELEASE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
